# Test profile used by `mvn test` and by the CI/CD build stage: an in-memory H2 database in
# MySQL mode, so the automated tests need no external MySQL server or cloud credentials.
spring.datasource.url=jdbc:h2:mem:cst323;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
