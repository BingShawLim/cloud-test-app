<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${pageTitle}, ~{::section})}">
<body>
<section>
    <h1 class="h3 mb-3" th:text="${pageTitle}">Add Contact</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" th:action="@{/contacts/save}" th:object="${contact}" novalidate>
                <input type="hidden" th:field="*{contactId}">
                <input type="hidden" th:field="*{createdDate}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="firstName">First name</label>
                        <input type="text" id="firstName" class="form-control"
                               th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}">error</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="lastName">Last name</label>
                        <input type="text" id="lastName" class="form-control"
                               th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}">error</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">error</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="phone">Phone</label>
                        <input type="text" id="phone" class="form-control"
                               th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">error</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="company">Company</label>
                        <input type="text" id="company" class="form-control"
                               th:field="*{company}"
                               th:classappend="${#fields.hasErrors('company')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('company')}"
                             th:errors="*{company}">error</div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/contacts}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
