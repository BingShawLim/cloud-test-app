<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Contacts', ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Contacts</h1>
        <a class="btn btn-primary" th:href="@{/contacts/new}">Add Contact</a>
    </div>

    <div th:if="${#lists.isEmpty(contacts)}" class="alert alert-info">
        No contacts have been added yet.
    </div>

    <div th:unless="${#lists.isEmpty(contacts)}" class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone</th>
                <th scope="col">Company</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contacts}">
                <td>
                    <a th:href="@{/contacts/{id}(id=${c.contactId})}"
                       th:text="${c.fullName}">Name</a>
                </td>
                <td th:text="${c.email}">email</td>
                <td th:text="${c.phone} ?: '—'">phone</td>
                <td th:text="${c.company} ?: '—'">company</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/contacts/{id}/edit(id=${c.contactId})}">Edit</a>
                    <form class="d-inline" method="post"
                          th:action="@{/contacts/{id}/delete(id=${c.contactId})}"
                          onsubmit="return confirm('Delete this contact?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
