<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Contact Detail', ~{::section})}">
<body>
<section>
    <h1 class="h3 mb-3" th:text="${contact.fullName}">Contact</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Contact ID</dt>
                <dd class="col-sm-9" th:text="${contact.contactId}">1</dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${contact.email}">email</dd>

                <dt class="col-sm-3">Phone</dt>
                <dd class="col-sm-9" th:text="${contact.phone} ?: '—'">phone</dd>

                <dt class="col-sm-3">Company</dt>
                <dd class="col-sm-9" th:text="${contact.company} ?: '—'">company</dd>

                <dt class="col-sm-3">Created</dt>
                <dd class="col-sm-9"
                    th:text="${#temporals.format(contact.createdDate, 'yyyy-MM-dd HH:mm')}">date</dd>
            </dl>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-outline-secondary"
           th:href="@{/contacts/{id}/edit(id=${contact.contactId})}">Edit</a>
        <a class="btn btn-link" th:href="@{/contacts}">Back to list</a>
    </div>
</section>
</body>
</html>
