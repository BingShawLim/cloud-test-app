# ---------------------------------------------------------------------------
# CST-323 Cloud Test Application - local configuration
# Cloud platforms override these values with environment variables so that no
# credentials are committed to the GIT repository.
# ---------------------------------------------------------------------------
spring.application.name=cloud-test-app
server.port=${PORT:8080}

# --- Datasource -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cst323?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:cst323user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate --------------------------------------------------------
# 'validate' is used deliberately: the schema is owned by ddl/schema.sql so the
# same DDL script can be run against each cloud provider's MySQL instance.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Thymeleaf --------------------------------------------------------------
spring.thymeleaf.cache=false

# --- Logging ----------------------------------------------------------------
logging.level.root=INFO
logging.level.edu.gcu.cst323=DEBUG
